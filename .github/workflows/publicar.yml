# Publica la carpeta web/ en GitHub Pages (gratis, con HTTPS y dominio propio).
# APAGADO hasta que el equipo decida: para activarlo,
#   1. Settings → Pages → Source: "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → Variables → PUBLICAR_PAGES = true
# Dominio propio: ver docs/arquitectura.md (sección "Dominio").
name: publicar

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [datos]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    if: vars.PUBLICAR_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
