# Publishes the web/ folder to GitHub Pages (free, with HTTPS and a custom domain).
# Runs on every push to main, after each data update and by hand (Actions → publish → Run workflow).
# Requires Settings → Pages → Source: "GitHub Actions" (already set).
# Custom domain: see docs/architecture.md (section "Domain").
name: publish

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
