# Runs the engine tests and validates the catalog on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The catalog CSV matches the web JSON
        run: |
          python scripts/catalog_to_json.py
          git diff --exit-code web/data/crops.json || (echo "::error::Run 'python scripts/catalog_to_json.py' and commit web/data/crops.json" && exit 1)
      - name: Engine tests
        run: npm test
